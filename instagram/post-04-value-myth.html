<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; background:#060608; overflow:hidden; }
.frame { width:100%; height:100%; padding:80px; display:flex; flex-direction:column; justify-content:space-between; }
.label { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:#c4a265; margin-bottom:32px; }
h1 { font-family:'DM Serif Display',serif; font-size:52px; font-weight:400; line-height:1.15; color:#e8e8ec; }
h1 em { font-style:italic; color:#f87171; }
.metrics { display:flex; flex-direction:column; gap:12px; }
.metric-row { display:flex; align-items:center; gap:16px; padding:16px 24px; background:#0c0c10; border:1px solid #1a1a22; border-radius:8px; }
.metric-name { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; color:#9898a4; width:180px; }
.metric-bar { flex:1; height:8px; background:#1a1a22; border-radius:4px; position:relative; overflow:hidden; }
.metric-fill { height:100%; border-radius:4px; }
.metric-fill.pos { background:#4ade80; }
.metric-fill.neg { background:#f87171; }
.metric-val { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; width:80px; text-align:right; }
.green { color:#4ade80; }
.red { color:#f87171; }
.muted { color:#5a5a68; }
.footer-bar { display:flex; justify-content:space-between; align-items:center; }
.footer-note { font-family:'DM Sans',sans-serif; font-size:14px; color:#5a5a68; }
.logo { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#5a5a68; }
</style></head><body>
<div class="frame">
  <div>
    <div class="label">Research</div>
    <h1>We tested 7 valuation metrics.<br><em>Most are broken.</em></h1>
  </div>
  <div class="metrics">
    <div class="metric-row">
      <div class="metric-name">P/S Ratio</div>
      <div class="metric-bar"><div class="metric-fill pos" style="width:61%"></div></div>
      <div class="metric-val green">+6.1%</div>
    </div>
    <div class="metric-row">
      <div class="metric-name">P/E Ratio</div>
      <div class="metric-bar"><div class="metric-fill pos" style="width:20%"></div></div>
      <div class="metric-val muted">+1.2%</div>
    </div>
    <div class="metric-row">
      <div class="metric-name">EV/EBITDA</div>
      <div class="metric-bar"><div class="metric-fill pos" style="width:15%"></div></div>
      <div class="metric-val muted">+0.8%</div>
    </div>
    <div class="metric-row">
      <div class="metric-name">P/B Ratio</div>
      <div class="metric-bar"><div class="metric-fill neg" style="width:38%"></div></div>
      <div class="metric-val red">&minus;3.8%</div>
    </div>
    <div class="metric-row">
      <div class="metric-name">Shareholder Yield</div>
      <div class="metric-bar"><div class="metric-fill neg" style="width:74%"></div></div>
      <div class="metric-val red">&minus;7.4%</div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="footer-note">2005-2026 | Quarterly TTM data | Full report on site</div>
    <div class="logo">Bivar Capital</div>
  </div>
</div>
</body></html>
