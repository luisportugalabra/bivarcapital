<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; background:#060608; overflow:hidden; }
.frame { width:100%; height:100%; padding:80px; display:flex; flex-direction:column; justify-content:space-between; }
.label { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:#c4a265; margin-bottom:32px; }
h1 { font-family:'DM Serif Display',serif; font-size:56px; font-weight:400; line-height:1.15; color:#e8e8ec; max-width:800px; }
h1 em { font-style:italic; color:#c4a265; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#1a1a22; border:1px solid #1a1a22; border-radius:10px; overflow:hidden; }
.stat { background:#0c0c10; padding:28px 32px; }
.stat-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:#5a5a68; margin-bottom:8px; }
.stat-val { font-family:'JetBrains Mono',monospace; font-size:36px; font-weight:700; color:#e8e8ec; }
.stat-val.green { color:#4ade80; }
.stat-val.gold { color:#c4a265; }
.footer-bar { display:flex; justify-content:space-between; align-items:center; }
.footer-note { font-family:'DM Sans',sans-serif; font-size:14px; color:#5a5a68; }
.logo { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#5a5a68; }
</style></head><body>
<div class="frame">
  <div>
    <div class="label">Research Finding</div>
    <h1>6-month momentum <em>dominates</em> the conventional 9-1.</h1>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">CAGR</div>
      <div class="stat-val green">+20.4%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Sharpe Ratio</div>
      <div class="stat-val gold">0.83</div>
    </div>
    <div class="stat">
      <div class="stat-label">Alpha vs S&P</div>
      <div class="stat-val green">+11.9%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Variants Tested</div>
      <div class="stat-val">254</div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="footer-note">254 months backtested | Not a Mag7 proxy</div>
    <div class="logo">Bivar Capital</div>
  </div>
</div>
</body></html>
