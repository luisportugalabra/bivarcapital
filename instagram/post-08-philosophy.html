<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; background:#060608; overflow:hidden; }
.frame { width:100%; height:100%; padding:80px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.glow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:800px; height:800px; background:radial-gradient(circle, rgba(196,162,101,0.05) 0%, transparent 60%); pointer-events:none; }
.quote { font-family:'DM Serif Display',serif; font-size:52px; font-style:italic; font-weight:400; line-height:1.3; color:#e8e8ec; max-width:750px; margin-bottom:48px; position:relative; z-index:1; }
.quote .gold { color:#c4a265; }
.divider { width:60px; height:2px; background:#c4a265; opacity:0.4; margin-bottom:40px; position:relative; z-index:1; }
.principles { display:flex; gap:48px; position:relative; z-index:1; margin-bottom:48px; }
.principle { text-align:center; }
.principle-icon { font-family:'JetBrains Mono',monospace; font-size:36px; font-weight:700; color:#c4a265; margin-bottom:8px; }
.principle-text { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#9898a4; }
.principle-sub { font-family:'DM Sans',sans-serif; font-size:12px; color:#5a5a68; margin-top:4px; }
.logo { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#5a5a68; position:relative; z-index:1; }
.url { font-family:'JetBrains Mono',monospace; font-size:13px; color:#c4a265; margin-top:12px; position:relative; z-index:1; }
</style></head><body>
<div class="frame">
  <div class="glow"></div>
  <div class="quote">Every position. Every thesis. <span class="gold">Every mistake.</span> Real capital.</div>
  <div class="divider"></div>
  <div class="principles">
    <div class="principle">
      <div class="principle-icon">01</div>
      <div class="principle-text">Backtest first</div>
      <div class="principle-sub">254+ months of data</div>
    </div>
    <div class="principle">
      <div class="principle-icon">02</div>
      <div class="principle-text">Real money</div>
      <div class="principle-sub">$1.1M+ deployed</div>
    </div>
    <div class="principle">
      <div class="principle-icon">03</div>
      <div class="principle-text">Full transparency</div>
      <div class="principle-sub">Every position public</div>
    </div>
  </div>
  <div class="logo">Bivar Capital</div>
  <div class="url">bivarcapital.com</div>
</div>
</body></html>
