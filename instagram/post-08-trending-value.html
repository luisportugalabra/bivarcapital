<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; background:#060608; overflow:hidden; }
.frame { width:100%; height:100%; padding:80px; display:flex; flex-direction:column; justify-content:space-between; }
.label { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:#c4a265; margin-bottom:32px; }
h1 { font-family:'DM Serif Display',serif; font-size:48px; font-weight:400; line-height:1.15; color:#e8e8ec; }
h1 em { font-style:italic; color:#c4a265; }
.body-text { font-family:'DM Sans',sans-serif; font-size:18px; color:#9898a4; line-height:1.7; max-width:700px; margin-top:16px; }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:1px; background:#1a1a22; border:1px solid #1a1a22; border-radius:10px; overflow:hidden; }
.stat { background:#0c0c10; padding:24px; text-align:center; }
.stat-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#5a5a68; margin-bottom:8px; }
.stat-val { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; }
.green { color:#4ade80; }
.gold { color:#c4a265; }
.white { color:#e8e8ec; }
.method { display:flex; gap:12px; flex-wrap:wrap; }
.step { display:flex; align-items:center; gap:12px; background:#0c0c10; border:1px solid #1a1a22; border-radius:8px; padding:16px 20px; flex:1; min-width:200px; }
.step-num { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:#c4a265; }
.step-text { font-family:'DM Sans',sans-serif; font-size:14px; color:#9898a4; line-height:1.4; }
.footer-bar { display:flex; justify-content:space-between; align-items:center; }
.footer-note { font-family:'DM Sans',sans-serif; font-size:14px; color:#5a5a68; }
.logo { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#5a5a68; }
</style></head><body>
<div class="frame">
  <div>
    <div class="label">Strategy Breakdown</div>
    <h1>Trending Value: <em>value + momentum</em> combined.</h1>
  </div>
  <div class="method">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Screen for cheapest 20% by Value Composite</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Rank by 6-month momentum</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Buy top 25 stocks</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">CAGR</div>
      <div class="stat-val green">+13.8%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Alpha</div>
      <div class="stat-val green">+5.4%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Sharpe</div>
      <div class="stat-val gold">0.82</div>
    </div>
    <div class="stat">
      <div class="stat-label">DD Reduction</div>
      <div class="stat-val white">10-20pp</div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="footer-note">TV3 variant | >$5B market cap | Monthly rebalance</div>
    <div class="logo">Bivar Capital</div>
  </div>
</div>
</body></html>
