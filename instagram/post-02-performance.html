<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; background:#060608; overflow:hidden; }
.frame { width:100%; height:100%; padding:80px; display:flex; flex-direction:column; justify-content:center; position:relative; }
.label { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:#c4a265; margin-bottom:40px; }
.big-number { font-family:'JetBrains Mono',monospace; font-size:160px; font-weight:700; color:#4ade80; line-height:1; margin-bottom:12px; }
.year { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:#5a5a68; margin-bottom:48px; }
.compare { display:flex; gap:48px; margin-bottom:48px; }
.compare-item { }
.compare-label { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:#5a5a68; margin-bottom:8px; }
.compare-val { font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700; }
.green { color:#4ade80; }
.muted { color:#9898a4; }
.divider { width:60px; height:2px; background:#c4a265; opacity:0.4; margin-bottom:24px; }
.note { font-family:'DM Sans',sans-serif; font-size:15px; color:#5a5a68; }
.logo { position:absolute; bottom:80px; right:80px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#5a5a68; }
</style></head><body>
<div class="frame">
  <div class="label">Portfolio Performance</div>
  <div class="big-number">+38.7%</div>
  <div class="year">2025 Full Year Return</div>
  <div class="compare">
    <div class="compare-item">
      <div class="compare-label">2026 YTD</div>
      <div class="compare-val green">+4.0%</div>
    </div>
    <div class="compare-item">
      <div class="compare-label">S&P 500 YTD</div>
      <div class="compare-val muted">+1.8%</div>
    </div>
    <div class="compare-item">
      <div class="compare-label">Alpha</div>
      <div class="compare-val green">+2.2%</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="note">Real capital. Updated daily. bivarcapital.com</div>
  <div class="logo">Bivar Capital</div>
</div>
</body></html>
