name: GDX Weekly Signal

on:
  schedule:
    # Every Friday at 22:00 UTC (after NYSE close at 20:00 UTC)
    - cron: '0 22 * * 5'
  workflow_dispatch:  # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run GDX signal
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/gdx_signal.py

      - name: Commit signal state
        run: |
          git config user.name "GDX Signal Bot"
          git config user.email "bot@bivarcapital.com"
          git add gdx-signal.json
          git diff --staged --quiet || git commit -m "Update GDX signal: $(cat gdx-signal.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["signal"], d["week"], f\"{d[\"gdx_weekly_ret\"]:+.1f}%\")')"
          git pull --rebase origin main
          git push
