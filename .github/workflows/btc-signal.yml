name: BTC Signal Check

on:
  schedule:
    - cron: '10 0 * * *'   # 00:10 UTC (01:10 Lisboa)
    - cron: '30 0 * * *'   # 00:30 UTC — retry if first missed
    - cron: '0 1 * * *'    # 01:00 UTC — retry
    - cron: '0 6 * * *'    # 06:00 UTC — catch-all
  workflow_dispatch:        # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process Telegram subscribers
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/btc_process_subscribers.py

      - name: Check BTC signal
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/btc_signal.py

      - name: Commit signal state
        run: |
          git config user.name "BTC Signal Bot"
          git config user.email "bot@bivarcapital.com"
          git add btc-signal.json
          git diff --staged --quiet || git commit -m "Update BTC signal: $(cat btc-signal.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\"signal\"], d[\"date\"])')"
          git push
