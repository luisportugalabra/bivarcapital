name: Update strategy data

on:
  schedule:
    - cron: '0 23 * * 1-6'  # Mon-Sat 23:00 UTC (Sat catches Friday close)
  workflow_dispatch:         # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install yfinance

      - name: Download TradingView data
        working-directory: scripts
        run: python download_tv.py

      - name: Run VC2 processing
        working-directory: scripts
        run: python vc2_trending_value.py

      - name: Copy wizard-data.json to repo root
        run: cp scripts/wizard-data.json wizard-data.json

      - name: Update portfolio prices
        run: python scripts/daily-update.py

      - name: Update momentum signal
        run: python scripts/momentum_signal.py

      - name: Compute momentum YTD return
        run: python scripts/momentum_ytd.py

      - name: Update YTD performance data
        run: python scripts/update_ytd.py

      - name: Update UK momentum signal
        run: python scripts/uk_momentum_signal.py

      - name: Update UK momentum YTD
        run: python scripts/uk_momentum_ytd.py

      - name: Update China momentum portfolio
        run: python scripts/china_momentum_ytd.py

      - name: Update Canada momentum signal
        run: python scripts/canada_momentum_signal.py

      - name: Update Canada momentum portfolio
        run: python scripts/canada_momentum_ytd.py

      - name: Update Denmark momentum signal
        run: python scripts/denmark_momentum_signal.py

      - name: Update Denmark momentum YTD
        run: python scripts/denmark_momentum_ytd.py

      - name: Update Netherlands momentum signal
        run: python scripts/netherlands_momentum_signal.py

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
