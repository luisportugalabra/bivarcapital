name: Update strategy data

on:
  schedule:
    - cron: '0 23 * * 1-6'  # Mon-Sat 23:00 UTC (Sat catches Friday close)
  workflow_dispatch:         # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install yfinance

      - name: Download TradingView data
        continue-on-error: true
        working-directory: scripts
        run: python download_tv.py

      - name: Run VC2 processing
        continue-on-error: true
        working-directory: scripts
        run: python vc2_trending_value.py

      - name: Copy wizard-data.json to repo root
        continue-on-error: true
        run: cp scripts/wizard-data.json wizard-data.json

      - name: Update momentum signal
        continue-on-error: true
        run: python scripts/momentum_signal.py

      - name: Compute momentum YTD return
        continue-on-error: true
        run: python scripts/momentum_ytd.py

      - name: Update YTD performance data
        continue-on-error: true
        run: python scripts/update_ytd.py

      - name: Update UK momentum signal
        continue-on-error: true
        run: python scripts/uk_momentum_signal.py

      - name: Update UK momentum YTD
        continue-on-error: true
        run: python scripts/uk_momentum_ytd.py

      - name: Update China momentum portfolio
        continue-on-error: true
        run: python scripts/china_momentum_ytd.py

      - name: Update Canada momentum signal
        continue-on-error: true
        run: python scripts/canada_momentum_signal.py

      - name: Update Canada momentum portfolio
        continue-on-error: true
        run: python scripts/canada_momentum_ytd.py

      - name: Update Germany momentum signal
        continue-on-error: true
        run: python scripts/germany_momentum_signal.py

      - name: Update Germany momentum YTD
        continue-on-error: true
        run: python scripts/germany_momentum_ytd.py

      - name: Update portfolio prices
        continue-on-error: true
        run: python scripts/daily-update.py

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi

      # Fires straight after the push so subscribers get the signal the same
      # day, instead of waiting for a cron that may run before the data lands.
      # Each function is a no-op unless its own monthly rebalance is in the
      # freshly pushed files, so running this daily is safe.
      - name: Trigger Telegram momentum signals (USA, Canada, Germany)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "SUPABASE_CRON_SECRET not set — skipping Telegram trigger"
            exit 0
          fi
          for fn in momentum-signal canada-momentum-signal germany-momentum-signal; do
            echo "--- $fn"
            curl -sS -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -w '\nHTTP %{http_code}\n' \
              "https://efiyeiwdywodjxxnslvu.functions.supabase.co/$fn" \
              || echo "  trigger failed (non-fatal)"
          done
