name: Update strategy data

on:
  schedule:
    - cron: '0 23 * * 1-5'  # Mon-Fri 23:00 UTC (after all markets close)
  workflow_dispatch:         # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install yfinance

      - name: Download TradingView data
        working-directory: scripts
        run: python download_tv.py

      - name: Run VC2 processing
        working-directory: scripts
        run: python vc2_trending_value.py

      - name: Copy wizard-data.json to repo root
        run: cp scripts/wizard-data.json wizard-data.json

      - name: Update portfolio prices
        run: python scripts/daily-update.py

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add wizard-data.json portfolio-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u +%Y-%m-%d)"
            git push
          fi
