<style>
:root {
  --bg: #060608; --border: #1a1a22; --text: #e8e8ec; --text-secondary: #9898a4; --text-muted: #5a5a68; --accent: #c4a265;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.7; font-size: 15px; }
.container { max-width: 720px; margin: 0 auto; padding: 0 24px; }
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,6,8,0.85); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 16px 0;
}
header .container { display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); text-decoration: none; }
nav a { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; margin-left: 24px; transition: color 0.2s; }
nav a:hover { color: var(--text); }
.content { padding: 80px 0 60px; }
.content h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 400; margin-bottom: 32px; }
.content p { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.85; margin-bottom: 16px; max-width: 600px; }
.content strong { color: var(--text); }
.content .muted { color: var(--text-muted); font-style: italic; }
footer { padding: 32px 0; border-top: 1px solid var(--border); text-align: center; }
footer p { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted); }
footer .brand { font-family: var(--font-display); font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div class="container">
    <a href="/" class="logo">Bivar Capital</a>
    <nav><a href="/about.html">About</a><a href="/portfolio.html">Portfolio</a></nav>
  </div>
</header>
<main class="container">
  <section class="content">
    <h1>Luis Portugal.</h1>
    <p><strong>38.</strong> Former CFO. 13 years in finance across Asia, Europe, and Africa.</p>
    <p>BSc Economics. MSc Finance. MBA.</p>
    <p class="muted">Sports lover. Mostly on a bicycle.</p>

    <p style="margin-top:24px">
      <a href="https://linkedin.com/in/luisportugalabra" style="color:var(--accent);text-decoration:none;margin-right:16px;font-size:0.82rem">LinkedIn</a>
      <a href="https://x.com/luisportugalabr" style="color:var(--accent);text-decoration:none;margin-right:16px;font-size:0.82rem">X</a>
      <a href="https://instagram.com/luisportugalabra" style="color:var(--accent);text-decoration:none;font-size:0.82rem">Instagram</a>
    </p>
  </section>
</main>
<footer>
  <div class="container">
    <p class="brand">Bivar Capital</p>
    <p>Luis Portugal</p>
  </div>
</footer>
</body>
</html>
